<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProString Coach v3 - Tabbed</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-hover: #2a2a2a;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text: #e0e0e0;
            --text-muted: #888;
            --tuning-good: #4caf50;
            --tuning-warn: #ff9800;
            --string-open: #bb86fc; 
            --string-fretted: #03dac6; 
            --highlight: #ffd700;
            --border: #333;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Light Mode Overrides */
        body.light-mode {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --surface-hover: #eeeeee;
            --text: #333333;
            --text-muted: #666666;
            --border: #dddddd;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header & Nav */
        header {
            width: 100%;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            box-sizing: border-box;
        }

        h1 { margin: 0; font-weight: 300; letter-spacing: 1px; font-size: 1.5rem; }
        
        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            background: none;
            border: none;
            color: var(--text);
        }

        /* Main Navigation Tabs */
        .main-nav {
            display: flex;
            gap: 5px;
            background: var(--surface);
            padding: 5px;
            border-radius: var(--radius);
            margin-top: 1rem;
            width: 90%;
            max-width: 900px;
            justify-content: center;
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
        .nav-btn.active { background: var(--primary); color: #000; font-weight: bold; }

        /* Container */
        .container {
            width: 90%;
            max-width: 900px;
            margin-top: 1rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        h3 { margin: 0 0 1rem 0; font-size: 1rem; color: var(--text-muted); }

        /* Tuner Specifics */
        .tuner-display {
            position: relative;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }

        .gauge-container {
            width: 260px;
            height: 130px;
            border-top-left-radius: 130px;
            border-top-right-radius: 130px;
            background: conic-gradient(from 180deg, #333 0%, #333 20%, var(--tuning-warn) 20%, var(--tuning-warn) 40%, var(--tuning-good) 40%, var(--tuning-good) 60%, var(--tuning-warn) 60%, var(--tuning-warn) 80%, #333 80%);
            position: relative;
            overflow: hidden;
        }

        .needle {
            width: 4px;
            height: 120px;
            background: white;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
            transform: rotate(0deg);
            transition: transform 0.1s ease-out;
            z-index: 2;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .center-knob {
            width: 20px;
            height: 20px;
            background: #555;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .note-display {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary);
            z-index: 4;
            pointer-events: none;
        }

        .detune-val {
            position: absolute;
            top: 85%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Instrument Visual Strings */
        .instrument-visual {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1rem;
        }
        .inst-string {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            font-weight: bold;
        }
        .inst-string:hover { border-color: var(--primary); }
        .inst-string.active { background: var(--primary); color: #000; }

        /* Buttons */
        button {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        button:hover { background: var(--surface-hover); border-color: var(--primary); }
        button.primary { background: var(--primary); color: #000; font-weight: bold; border: none; }
        button.danger { border-color: var(--error); color: var(--error); }
        button.danger:hover { background: var(--error); color: white; }
        button.small { padding: 4px 8px; font-size: 0.8rem; }

        /* Piece List */
        .piece-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }

        .piece-item {
            background: #252525;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        body.light-mode .piece-item { background: #f0f0f0; }

        .piece-item:hover { background: var(--surface-hover); }
        .piece-item.active { border-left-color: var(--highlight); background: var(--surface-hover); }

        .piece-actions { display: flex; gap: 5px; }
        .piece-actions button { padding: 4px 8px; font-size: 0.8rem; }

        /* Note Input & Table */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        input, select {
            background: #333;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 4px;
            flex-grow: 1;
        }
        body.light-mode input, body.light-mode select {
            background: #fff;
            border-color: #ccc;
        }

        .note-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .note-table th, .note-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .note-row { transition: background 0.2s; }
        .note-row.active { background: rgba(255, 215, 0, 0.1); border-left: 2px solid var(--highlight); }
        .note-row.played { opacity: 0.6; }

        .feedback-cell {
            font-size: 0.8rem;
            font-weight: bold;
        }
        .fb-ok { color: var(--tuning-good); }
        .fb-warn { color: var(--tuning-warn); }
        .fb-err { color: var(--error); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--primary);
        }
        .modal h2 { margin-top: 0; }
        .modal-input { width: 100%; margin-bottom: 1rem; box-sizing: border-box; }

        /* Metronome Visual */
        .metronome-dot {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            transition: background 0.1s;
        }
        .metronome-dot.pulse {
            background: var(--highlight);
            box-shadow: 0 0 15px var(--highlight);
        }

        /* Target Indicator */
        .target-indicator {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            background: #252525;
            color: var(--string-open);
            font-weight: bold;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
        }

        /* Tabs inside cards */
        .tabs { display: flex; gap: 10px; margin-bottom: 1rem; }
        .tab-btn { flex: 1; text-align: center; background: #252525; }
        .tab-btn.active { background: var(--primary); color: #000; }

        .hidden { display: none !important; }

        /* Login Form */
        .login-form { display: flex; flex-direction: column; gap: 10px; }
        .login-error { color: var(--error); font-size: 0.8rem; min-height: 1.2em; }

        /* Fretboard Visualization */
        .mini-fretboard {
            display: flex;
            gap: 2px;
            margin-top: 5px;
        }
        .fret-segment {
            width: 20px;
            height: 4px;
            background: #555;
        }
        .fret-segment.filled { background: var(--secondary); }

    </style>
</head>
<body>

<header>
    <h1>ProString Coach v3</h1>
    <div class="header-controls">
        <button id="userBtn" onclick="showLoginModal()">Login</button>
        <button class="theme-toggle" onclick="toggleTheme()">🌙/☀️</button>
    </div>
</header>

<!-- Main Navigation Tabs -->
<div class="main-nav">
    <button class="nav-btn active" onclick="switchMainTab('tuner')">🎵 Tuner</button>
    <button class="nav-btn" onclick="switchMainTab('practice')">📝 Practice</button>
    <button class="nav-btn" onclick="switchMainTab('library')">📚 Library</button>
</div>

<div class="container">
    
    <!-- TUNER TAB -->
    <div id="tab-tuner" class="card full-width">
        <div class="controls" style="display:flex; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:10px;">
            <select id="instrumentSelect">
                <option value="violin">Violin (G D A E)</option>
                <option value="guitar">Standard Guitar (E A D G B E)</option>
                <option value="bass">Bass Guitar (E A D G)</option>
                <option value="cello">Cello (C G D A)</option>
                <option value="ukulele">Ukulele (G C E A)</option>
            </select>
            <div style="display:flex; gap:10px;">
                <button id="modeBtn" onclick="toggleMode()">Mode: Open Strings</button>
                <button id="micBtn" onclick="toggleMic()">Start Mic</button>
            </div>
        </div>

        <!-- Instrument Visual Strings -->
        <div class="instrument-visual" id="instStrings">
            <!-- Generated by JS -->
        </div>

        <div class="target-indicator" id="targetDisplay">Target: Violin Open Strings (G D A E)</div>

        <div class="tuner-display">
            <div class="gauge-container">
                <div class="needle" id="needle"></div>
                <div class="center-knob"></div>
            </div>
            <div class="note-display" id="noteDisplay">--</div>
            <div class="detune-val" id="centsDisplay">0 cents</div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:1rem; align-items:center;">
            <input type="number" id="freqInput" placeholder="Frequency (Hz)" style="flex:1;">
            <button onclick="playReference()">Play Ref Tone</button>
            <label style="font-size:0.8rem; display:flex; align-items:center; gap:5px;">
                Tolerance: <input type="range" id="toleranceRange" min="0" max="20" value="5" style="width:50px; margin:0;">
            </label>
        </div>
    </div>

    <!-- PRACTICE TAB -->
    <div id="tab-practice" class="card hidden">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('editor', 'tab-practice')">Editor</button>
            <button class="tab-btn" onclick="switchSubTab('ref', 'tab-practice')">Reference</button>
        </div>

        <!-- Editor Sub-Tab -->
        <div id="sub-editor" class="tab-content">
            <h2>Edit Piece</h2>
            <div style="margin-bottom:1rem;">
                <input type="text" id="pieceNameInput" placeholder="Piece Name (e.g., Minuet in G)">
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="primary" onclick="saveCurrentPiece()" style="flex:1">Save / Update Piece</button>
                    <button onclick="startNewPiece()" class="small">New</button>
                </div>
            </div>
            
            <div class="input-row">
                <select id="noteStringSelect"></select>
                <select id="noteFretSelect">
                    <option value="0">Open</option>
                    <option value="1">1st Fret</option>
                    <option value="2">2nd Fret</option>
                    <option value="3">3rd Fret</option>
                    <option value="4">4th Fret</option>
                    <option value="5">5th Fret</option>
                    <option value="6">6th Fret</option>
                    <option value="7">7th Fret</option>
                    <option value="8">8th Fret</option>
                    <option value="9">9th Fret</option>
                    <option value="10">10th Fret</option>
                    <option value="11">11th Fret</option>
                    <option value="12">12th Fret (Octave)</option>
                </select>
                <button class="primary small" onclick="addNoteToPiece()">+ Add</button>
                <button class="small" onclick="undoLastNote()">Undo</button>
                <button class="small danger" onclick="clearAllNotes()">Clear</button>
            </div>

            <table class="note-table">
                <thead><tr><th>#</th><th>Note</th><th>Mini-Fret</th><th>Action</th></tr></thead>
                <tbody id="currentPieceNotesBody">
                    <!-- Notes go here -->
                </tbody>
            </table>
            <div style="margin-top:1rem; text-align:center;">
                <div class="metronome-dot" id="metronomeDot"></div>
                <button onclick="playPiece()" id="playPieceBtn">▶ Play Piece</button>
                <button onclick="stopPiece()" id="stopPieceBtn" class="danger hidden">■ Stop</button>
            </div>
        </div>

        <!-- Reference Sub-Tab -->
        <div id="sub-ref" class="tab-content hidden">
            <h2>Chromatic Reference</h2>
            <div class="fretboard-grid" id="chromaticGrid">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- LIBRARY TAB -->
    <div id="tab-library" class="card full-width">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSubTab('my-pieces', 'tab-library')">My Pieces</button>
            <button class="tab-btn" onclick="switchSubTab('trash', 'tab-library')">Trash / History</button>
        </div>

        <div id="sub-my-pieces" class="tab-content">
            <ul class="piece-list" id="savedPiecesList">
                <!-- Saved pieces -->
            </ul>
        </div>

        <div id="sub-trash" class="tab-content hidden">
            <h2>Deleted Pieces (Recoverable)</h2>
            <p style="font-size:0.9rem; color:#888;">Pieces stay here for 7 days before permanent deletion.</p>
            <ul class="piece-list" id="trashList">
                <!-- Trash items -->
            </ul>
        </div>
    </div>

</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
    <div class="modal">
        <h2>Login / Register</h2>
        <div class="login-form">
            <input type="text" id="usernameInput" placeholder="Username" class="modal-input">
            <input type="password" id="passwordInput" placeholder="Password" class="modal-input">
            <div class="login-error" id="loginError"></div>
            <button class="primary" onclick="handleLogin()">Log In</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    // --- Data Structures & State ---
    const NOTE_STRINGS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    const INSTRUMENTS = {
        violin: { strings: ["G3", "D4", "A4", "E5"], label: "Violin" },
        guitar: { strings: ["E2", "A2", "D3", "G3", "B3", "E4"], label: "Guitar" },
        bass: { strings: ["E1", "A1", "D2", "G2"], label: "Bass" },
        cello: { strings: ["C2", "G2", "D3", "A3"], label: "Cello" },
        ukulele: { strings: ["G4", "C4", "E4", "A4"], label: "Ukulele" }
    };

    let currentUser = null;
    let appData = { users: {} }; // Structure: { username: { password: "...", pieces: [], trash: [] } }
    
    // Runtime State
    let audioContext = null;
    let analyser = null;
    let mediaStreamSource = null;
    let isListening = false;
    let animationId = null;
    let currentInstrument = "violin";
    let isFrettedMode = false;
    
    // Piece Editing State
    let currentPieceNotes = [];
    let editingPieceId = null;
    let isPlayingPiece = false;
    let activeNoteIndex = -1;
    let pieceInterval = null;

    // DOM Elements
    const needle = document.getElementById('needle');
    const noteDisplay = document.getElementById('noteDisplay');
    const centsDisplay = document.getElementById('centsDisplay');
    const targetDisplay = document.getElementById('targetDisplay');
    const micBtn = document.getElementById('micBtn');
    const modeBtn = document.getElementById('modeBtn');
    const instrumentSelect = document.getElementById('instrumentSelect');
    const pieceNameInput = document.getElementById('pieceNameInput');
    const currentNotesBody = document.getElementById('currentPieceNotesBody');
    const savedPiecesList = document.getElementById('savedPiecesList');
    const trashList = document.getElementById('trashList');
    const chromaticGrid = document.getElementById('chromaticGrid');
    const noteStringSelect = document.getElementById('noteStringSelect');
    const noteFretSelect = document.getElementById('noteFretSelect');
    const loginModal = document.getElementById('loginModal');
    const loginError = document.getElementById('loginError');
    const metronomeDot = document.getElementById('metronomeDot');
    const instStringsContainer = document.getElementById('instStrings');

    // --- Initialization ---
    window.onload = () => {
        loadData();
        setupChromaticGrid();
        updateInstrumentUI();
        
        // Check if already logged in via session
        const sessionUser = sessionStorage.getItem('proStringUser');
        if(sessionUser && appData.users[sessionUser]) {
            loginUser(sessionUser);
        } else {
            showLoginModal();
        }

        instrumentSelect.addEventListener('change', () => {
            currentInstrument = instrumentSelect.value;
            updateInstrumentUI();
            if(isListening) toggleMic(); 
        });
    };

    function loadData() {
        const stored = localStorage.getItem('proStringData');
        if(stored) {
            appData = JSON.parse(stored);
        } else {
            appData.users = {};
        }
    }

    function saveData() {
        localStorage.setItem('proStringData', JSON.stringify(appData));
    }

    // --- User Auth ---
    function showLoginModal() {
        loginModal.style.display = 'flex';
        document.getElementById('usernameInput').focus();
    }

    function closeModal() {
        loginModal.style.display = 'none';
        loginError.textContent = '';
        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
    }

    function handleLogin() {
        const u = document.getElementById('usernameInput').value.trim();
        const p = document.getElementById('passwordInput').value.trim();
        
        if(!u || !p) {
            loginError.textContent = "Please enter both username and password.";
            return;
        }

        if(appData.users[u]) {
            if(appData.users[u].password === p) {
                loginUser(u);
            } else {
                loginError.textContent = "Incorrect password.";
            }
        } else {
            appData.users[u] = {
                password: p,
                pieces: [],
                trash: []
            };
            saveData();
            loginUser(u);
        }
    }

    function loginUser(username) {
        currentUser = username;
        sessionStorage.setItem('proStringUser', username);
        loginModal.style.display = 'none';
        renderUserPanel();
        renderLibrary();
        renderTrash();
        
        if(appData.users[username].pieces.length > 0) {
            loadPieceIntoEditor(appData.users[username].pieces[0].id);
        } else {
            startNewPiece();
        }
    }

    function logout() {
        currentUser = null;
        sessionStorage.removeItem('proStringUser');
        stopPiece();
        switchMainTab('tuner');
        showLoginModal();
    }

    function renderUserPanel() {
        const panel = document.getElementById('userBtn');
        panel.innerText = currentUser ? `Logout (${currentUser})` : 'Login';
        panel.onclick = () => {
            if(currentUser) logout();
            else showLoginModal();
        };
    }

    // --- Theme Toggle ---
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    // --- Navigation ---
    function switchMainTab(tabName) {
        ['tuner', 'practice', 'library'].forEach(t => {
            const el = document.getElementById(`tab-${t}`);
            if(el) el.classList.add('hidden');
        });
        document.getElementById(`tab-${tabName}`).classList.remove('hidden');

        document.querySelectorAll('.main-nav .nav-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }

    function switchSubTab(subTabName, parentTabId) {
        const parentTab = document.getElementById(parentTabId);
        parentTab.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`sub-${subTabName}`).classList.remove('hidden');

        parentTab.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }

    // --- Instrument UI ---
    function updateInstrumentUI() {
        const inst = INSTRUMENTS[currentInstrument];
        targetDisplay.innerText = `Target: ${inst.label} Open Strings (${inst.strings.join(', ')})`;
        targetDisplay.style.color = isFrettedMode ? 'var(--string-fretted)' : 'var(--string-open)';
        updateStringDropdown();
        renderInstrumentStrings();
    }

    function updateStringDropdown() {
        const inst = INSTRUMENTS[currentInstrument];
        noteStringSelect.innerHTML = '';
        inst.strings.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = s;
            noteStringSelect.appendChild(opt);
        });
    }

    function renderInstrumentStrings() {
        const inst = INSTRUMENTS[currentInstrument];
        instStringsContainer.innerHTML = '';
        inst.strings.forEach(s => {
            const div = document.createElement('div');
            div.className = 'inst-string';
            div.innerText = s.charAt(0);
            div.title = s;
            div.onclick = () => playReferenceNote(s);
            instStringsContainer.appendChild(div);
        });
    }

    function toggleMode() {
        isFrettedMode = !isFrettedMode;
        modeBtn.innerText = isFrettedMode ? "Mode: Fretted" : "Mode: Open Strings";
        updateInstrumentUI();
    }

    // --- Tuner Logic ---
    async function toggleMic() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (isListening) {
            isListening = false;
            micBtn.innerText = "Start Mic";
            micBtn.classList.remove('active');
            cancelAnimationFrame(animationId);
            noteDisplay.innerText = "--";
            needle.style.transform = `rotate(0deg)`;
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: false, autoGainControl: false } 
            });
            mediaStreamSource = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            mediaStreamSource.connect(analyser);
            
            isListening = true;
            micBtn.innerText = "Stop Mic";
            micBtn.classList.add('active');
            updatePitch();
        } catch (err) {
            alert("Microphone error: " + err);
        }
    }

    function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1;

        let maxCorr = -Infinity;
        let lag = -1;
        
        let startLag = Math.floor(sampleRate / 2000); 
        let endLag = Math.min(Math.floor(sampleRate / 50), SIZE/2);

        for (let i = startLag; i < endLag; i++) {
             let c = 0;
             for(let j=0; j<endLag; j++) c += buf[j] * buf[j+i];
             if(c > maxCorr) {
                 maxCorr = c;
                 lag = i;
             }
        }

        if (lag === -1) return -1;

        let x1 = lag - 1, x2 = lag, x3 = lag + 1;
        let y1 = getCorr(x1), y2 = getCorr(x2), y3 = getCorr(x3);
        function getCorr(l) {
            if(l < 0 || l >= SIZE/2) return 0;
            let sum = 0;
            for(let j=0; j<SIZE-l; j++) sum += buf[j]*buf[j+l];
            return sum;
        }
        let shift = (2 * y2 - y1 - y3) / (2 * (y1 + y3) - 4 * y2);
        let period = lag + shift;
        return sampleRate / period;
    }

    function updatePitch() {
        if (!isListening) return;

        let buf = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buf);
        let freq = autoCorrelate(buf, audioContext.sampleRate);

        if (freq !== -1) {
            let noteNum = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
            let noteIdx = Math.round(noteNum);
            let detune = 1200 * Math.log(freq / (440 * Math.pow(2, (noteIdx - 69) / 12))) / Math.log(2);

            let noteName = NOTE_STRINGS[noteIdx % 12];
            noteDisplay.innerText = noteName;
            
            let clampedDetune = Math.max(-50, Math.min(50, detune));
            let rotation = (clampedDetune / 50) * 45;
            needle.style.transform = `rotate(${rotation}deg)`;
            
            let tolerance = parseInt(document.getElementById('toleranceRange').value);
            let isInTune = Math.abs(detune) < tolerance;
            let isTargetNote = checkIfMatchesCurrentTarget(noteName, detune);

            if(isInTune) {
                noteDisplay.style.color = "#4caf50";
                centsDisplay.innerText = "In Tune";
                if(isPlayingPiece && activeNoteIndex >= 0) {
                     markNotePlayed(activeNoteIndex, true);
                }
            } else {
                noteDisplay.style.color = "#cf6679";
                centsDisplay.innerText = (detune > 0 ? "+" : "") + Math.round(detune) + " cents";
                if(isPlayingPiece && activeNoteIndex >= 0) {
                     markNotePlayed(activeNoteIndex, false, Math.round(detune));
                }
            }
        }

        animationId = requestAnimationFrame(updatePitch);
    }

    function checkIfMatchesCurrentTarget(noteName, detune) {
        if(!isPlayingPiece || activeNoteIndex < 0) return false;
        const target = currentPieceNotes[activeNoteIndex];
        if(!target) return false;
        return noteName === target.noteName;
    }

    function playReference() {
        const freq = parseFloat(document.getElementById('freqInput').value);
        if(!freq) return;
        playTone(freq);
    }

    function playReferenceNote(stringLabel) {
        let midi = stringToMidi(stringLabel);
        let targetFreq = 440 * Math.pow(2, (midi - 69) / 12);
        playTone(targetFreq);
    }

    function playTone(freq) {
        const osc = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioContext.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 1);
        osc.connect(gainNode);
        gainNode.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 1);
    }

    // --- Piece Management ---

    function startNewPiece() {
        editingPieceId = null;
        currentPieceNotes = [];
        pieceNameInput.value = "";
        renderCurrentNotes();
    }

    function saveCurrentPiece() {
        if(!currentUser) return;
        const name = pieceNameInput.value.trim() || `Untitled ${Date.now()}`;
        
        const enrichedNotes = currentPieceNotes.map(n => {
            const baseFreq = stringToFreq(n.string);
            const semitones = parseInt(n.fret);
            const freq = baseFreq * Math.pow(2, semitones / 12);
            const midi = 12 * (Math.log(freq / 440) / Math.log(2)) + 69;
            return {
                ...n,
                freq: freq,
                midi: Math.round(midi),
                noteName: NOTE_STRINGS[Math.round(midi) % 12]
            };
        });

        const pieceData = {
            id: editingPieceId || Date.now().toString(),
            name: name,
            notes: enrichedNotes,
            createdAt: Date.now()
        };

        const user = appData.users[currentUser];
        
        if(editingPieceId) {
            const idx = user.pieces.findIndex(p => p.id === editingPieceId);
            if(idx > -1) user.pieces[idx] = pieceData;
            user.trash = user.trash.filter(t => t.id !== editingPieceId);
        } else {
            user.pieces.push(pieceData);
        }

        saveData();
        renderLibrary();
        renderTrash();
        editingPieceId = pieceData.id;
        alert("Piece Saved!");
    }

    function loadPieceIntoEditor(id) {
        const user = appData.users[currentUser];
        const piece = user.pieces.find(p => p.id === id);
        if(piece) {
            editingPieceId = piece.id;
            pieceNameInput.value = piece.name;
            currentPieceNotes = piece.notes;
            renderCurrentNotes();
            switchMainTab('practice');
            switchSubTab('editor', 'tab-practice');
        }
    }

    function deletePiece(id) {
        const user = appData.users[currentUser];
        const idx = user.pieces.findIndex(p => p.id === id);
        if(idx > -1) {
            const piece = user.pieces.splice(idx, 1)[0];
            piece.deletedAt = Date.now();
            user.trash.unshift(piece);
            saveData();
            renderLibrary();
            renderTrash();
            if(editingPieceId === id) startNewPiece();
        }
    }

    function restorePiece(id) {
        const user = appData.users[currentUser];
        const idx = user.trash.findIndex(p => p.id === id);
        if(idx > -1) {
            const piece = user.trash.splice(idx, 1)[0];
            delete piece.deletedAt;
            user.pieces.push(piece);
            saveData();
            renderLibrary();
            renderTrash();
        }
    }

    function permanentlyDelete(id) {
        const user = appData.users[currentUser];
        user.trash = user.trash.filter(p => p.id !== id);
        saveData();
        renderTrash();
    }

    function renderLibrary() {
        if(!currentUser) return;
        const user = appData.users[currentUser];
        savedPiecesList.innerHTML = '';
        user.pieces.forEach(p => {
            const li = document.createElement('li');
            li.className = `piece-item ${editingPieceId === p.id ? 'active' : ''}`;
            li.innerHTML = `
                <span onclick="loadPieceIntoEditor('${p.id}')">${p.name}</span>
                <div class="piece-actions">
                    <button onclick="loadPieceIntoEditor('${p.id}')">Edit</button>
                    <button class="danger" onclick="deletePiece('${p.id}')">Del</button>
                </div>
            `;
            savedPiecesList.appendChild(li);
        });
    }

    function renderTrash() {
        if(!currentUser) return;
        const user = appData.users[currentUser];
        trashList.innerHTML = '';
        user.trash.forEach(p => {
            const li = document.createElement('li');
            li.className = 'piece-item';
            const date = new Date(p.deletedAt).toLocaleDateString();
            li.innerHTML = `
                <div>
                    <strong>${p.name}</strong> <small style="color:#666">(${date})</small>
                </div>
                <div class="piece-actions">
                    <button onclick="restorePiece('${p.id}')">Restore</button>
                    <button class="danger" onclick="permanentlyDelete('${p.id}')">X</button>
                </div>
            `;
            trashList.appendChild(li);
        });
    }

    // --- Note Editor Logic ---

    function addNoteToPiece() {
        const str = noteStringSelect.value;
        const fret = noteFretSelect.value;
        
        const baseMidi = stringToMidi(str);
        const finalMidi = baseMidi + parseInt(fret);
        const noteName = NOTE_STRINGS[finalMidi % 12];

        currentPieceNotes.push({
            string: str,
            fret: fret,
            noteName: noteName,
            midi: finalMidi
        });

        renderCurrentNotes();
    }

    function undoLastNote() {
        if(currentPieceNotes.length > 0) {
            currentPieceNotes.pop();
            renderCurrentNotes();
        }
    }

    function clearAllNotes() {
        if(confirm("Are you sure you want to clear all notes?")) {
            currentPieceNotes = [];
            renderCurrentNotes();
        }
    }

    function removeNoteFromPiece(index) {
        currentPieceNotes.splice(index, 1);
        renderCurrentNotes();
    }

    function renderCurrentNotes() {
        currentNotesBody.innerHTML = '';
        currentPieceNotes.forEach((n, i) => {
            const tr = document.createElement('tr');
            tr.className = `note-row ${i === activeNoteIndex ? 'active' : ''}`;
            tr.id = `row-${i}`;
            
            // Mini Fretboard
            let fretboardHtml = '<div class="mini-fretboard">';
            for(let f=0; f<=12; f++) {
                fretboardHtml += `<div class="fret-segment ${f <= n.fret ? 'filled' : ''}"></div>`;
            }
            fretboardHtml += '</div>';

            tr.innerHTML = `
                <td>${i + 1}</td>
                <td>${n.noteName} <small>(${n.string} ${n.fret === '0' ? 'Open' : n.fret + 'th'})</small></td>
                <td>${fretboardHtml}</td>
                <td>
                    <button class="danger small" style="padding:2px 5px;" onclick="removeNoteFromPiece(${i})">×</button>
                </td>
                <td class="feedback-cell" id="fb-${i}"></td>
            `;
            currentNotesBody.appendChild(tr);
        });
    }

    function stringToMidi(str) {
        const map = {
            'E2': 40, 'A2': 45, 'D3': 50, 'G3': 55, 'B3': 59, 'E4': 64,
            'E1': 28, 'A1': 33, 'D2': 38, 'G2': 43,
            'G3_v': 55, 'D4_v': 62, 'A4_v': 69, 'E5_v': 76,
            'G4_u': 67, 'C4_u': 48, 'E4_u': 64, 'A4_u': 69
        };
        
        switch(str) {
            case 'E2': return 40; case 'A2': return 45; case 'D3': return 50; 
            case 'G3': return 55; case 'B3': return 59; case 'E4': return 64;
            case 'E1': return 28; case 'A1': return 33; case 'D2': return 38; 
            case 'G2': return 43;
            case 'G3': return 55; case 'D4': return 62; case 'A4': return 69; case 'E5': return 76;
            case 'G4': return 67; case 'C4': return 48; case 'E4': return 64; case 'A4': return 69;
            default: return 60;
        }
    }

    function stringToFreq(str) {
        return 440 * Math.pow(2, (stringToMidi(str) - 69) / 12);
    }

    // --- Playback & Feedback Loop ---

    function playPiece() {
        if(currentPieceNotes.length === 0) return;
        
        stopPiece();
        isPlayingPiece = true;
        activeNoteIndex = 0;
        
        document.getElementById('playPieceBtn').classList.add('hidden');
        document.getElementById('stopPieceBtn').classList.remove('hidden');
        
        if(!isListening) toggleMic();

        processNextNote();
    }

    function stopPiece() {
        isPlayingPiece = false;
        activeNoteIndex = -1;
        clearTimeout(pieceInterval);
        metronomeDot.classList.remove('pulse');
        document.getElementById('playPieceBtn').classList.remove('hidden');
        document.getElementById('stopPieceBtn').classList.add('hidden');
        
        document.querySelectorAll('.note-row').forEach(el => {
            el.classList.remove('active', 'played');
            const fb = el.querySelector('.feedback-cell');
            if(fb) fb.innerHTML = '';
        });
        noteDisplay.innerText = "--";
        needle.style.transform = `rotate(0deg)`;
    }

    function processNextNote() {
        if(!isPlayingPiece) return;
        
        if(activeNoteIndex >= 0) {
            const prevRow = document.getElementById(`row-${activeNoteIndex}`);
            if(prevRow) prevRow.classList.remove('active');
        }

        activeNoteIndex++;
        
        if(activeNoteIndex >= currentPieceNotes.length) {
            finishPiece();
            return;
        }

        const currRow = document.getElementById(`row-${activeNoteIndex}`);
        if(currRow) {
            currRow.classList.add('active');
            currRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        metronomeDot.classList.add('pulse');
        setTimeout(() => metronomeDot.classList.remove('pulse'), 200);

        const note = currentPieceNotes[activeNoteIndex];
        const freq = 440 * Math.pow(2, (note.midi - 69) / 12);
        playTone(freq);

        pieceInterval = setTimeout(processNextNote, 2000);
    }

    function markNotePlayed(index, success, detuneVal) {
        const row = document.getElementById(`row-${index}`);
        if(!row || row.classList.contains('played')) return;

        row.classList.add('played');
        const fbCell = row.querySelector('.feedback-cell');
        
        if(success) {
            fbCell.innerHTML = '<span class="fb-ok">✓ Perfect</span>';
        } else {
            const dir = detuneVal > 0 ? "Sharp ↑" : "Flat ↓";
            fbCell.innerHTML = `<span class="fb-warn">${Math.abs(detuneVal)}c ${dir}</span>`;
        }
    }

    function finishPiece() {
        setTimeout(() => {
            stopPiece();
            alert("Piece Finished! Great job.");
        }, 1000);
    }

    function setupChromaticGrid() {
        NOTE_STRINGS.forEach(note => {
            const btn = document.createElement('div');
            btn.className = 'note-btn';
            btn.innerText = note;
            btn.onclick = () => playReferenceNote(note);
            chromaticGrid.appendChild(btn);
        });
    }

</script>
